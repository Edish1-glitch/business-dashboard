name: Background Gmail sync

# Triggers an incremental Gmail sync on the deployed app every ~15 min so new
# invoices are detected automatically and a push notification is sent — without
# the user manually syncing. Authenticated with the CRON_SECRET repo secret.
#
# Setup: add a repository secret named CRON_SECRET whose value matches the
# CRON_SECRET env var on Render (Settings → Secrets and variables → Actions).
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger background sync
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "CRON_SECRET secret is not set — skipping."
            exit 0
          fi
          # Warm the instance first (free tier may be spun down), then run the sync.
          curl -sS -m 60 -o /dev/null "https://business-dashboard-362m.onrender.com/login" || true
          resp=$(curl -sS -m 300 -w "\nHTTP %{http_code}" \
            -H "Authorization: Bearer $CRON_SECRET" \
            "https://business-dashboard-362m.onrender.com/api/cron/sync" || echo "request failed")
          echo "$resp"
