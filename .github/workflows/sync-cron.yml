name: Background Gmail sync

# Triggers an incremental Gmail sync on the deployed app every ~15 min so new
# invoices are detected automatically and a push notification is sent — without
# the user manually syncing. Authenticated with the CRON_SECRET repo secret.
#
# Setup: add a repository secret named CRON_SECRET whose value matches the
# CRON_SECRET env var of the deployed app (the Oracle VM's deploy/oracle/.env).
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger background sync
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "CRON_SECRET secret is not set — skipping."
            exit 0
          fi
          # Run the incremental sync on the Oracle VM (always-on, no warm-up needed).
          resp=$(curl -sS -m 300 -w "\nHTTP %{http_code}" \
            -H "Authorization: Bearer $CRON_SECRET" \
            "https://84.13.66.121.sslip.io/api/cron/sync" || echo "request failed")
          echo "$resp"
