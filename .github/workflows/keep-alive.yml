name: Keep Oracle active

# The Oracle Always-Free VM doesn't spin down, but Oracle may reclaim an instance
# that's idle for ~7 days. This periodic external ping keeps network activity up
# so the instance isn't flagged idle. (Repo is public → Actions minutes are free.)
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping app
        run: |
          code=$(curl -sS -m 40 -o /dev/null -w "%{http_code}" https://84.13.66.121.sslip.io/login || echo "000")
          echo "HTTP $code from /login at $(date -u)"
