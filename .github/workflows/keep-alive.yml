name: Keep Render awake

# Render's free tier spins the instance down after ~15 min of inactivity, and
# waking it takes ~50s (the "slow to load / can't navigate" symptom). This job
# pings the app every ~10 min so it stays warm. GitHub cron is best-effort and
# may run a few minutes late, so 10 min leaves margin under the 15 min window.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping app
        run: |
          code=$(curl -sS -m 40 -o /dev/null -w "%{http_code}" https://business-dashboard-362m.onrender.com/login || echo "000")
          echo "HTTP $code from /login at $(date -u)"
